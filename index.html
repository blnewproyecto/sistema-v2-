<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Cafetería</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <button class="btn-tab active" onclick="cambiarPestana('pos')">☕ Punto de Venta</button>
      <button class="btn-tab" onclick="cambiarPestana('inventario')">📦 Inventario</button>
      <button class="btn-tab" onclick="cambiarPestana('corte')">📊 Corte de Caja</button>
    </div>
    <div class="nav-right">
      <button class="btn-comandas-pendientes" onclick="abrirModalComandas()">
        ☁️ Comandas Pendientes <span id="badgeComandasCount" class="badge">0</span>
      </button>
    </div>
  </nav>

  <main id="tab-pos" class="seccion active">
    <div class="pos-grid">
      
      <section class="panel-catalogo">
        <h2>Bebidas Reales</h2>
        
        <div class="modificadores">
          <label for="selectLeche"><strong>Tipo de Leche:</strong></label>
          <select id="selectLeche">
            <option value="Entera">Entera ($0)</option>
            <option value="Deslactosada">Deslactosada ($0)</option>
            <option value="Avena">Avena (+$10)</option>
            <option value="Almendra">Almendra (+$10)</option>
          </select>
        </div>

        <div id="gridProductos" class="grid-productos">
          <div class="card-producto" onclick="agregarAlCarrito('Espresso', 35)"><strong>Espresso</strong><span>$35</span></div>
          <div class="card-producto" onclick="agregarAlCarrito('Americano', 45)"><strong>Americano</strong><span>$45</span></div>
          <div class="card-producto" onclick="agregarAlCarrito('Cappuccino', 60)"><strong>Cappuccino</strong><span>$60</span></div>
          <div class="card-producto" onclick="agregarAlCarrito('Flat White', 65)"><strong>Flat White</strong><span>$65</span></div>
          <div class="card-producto" onclick="agregarAlCarrito('Latte 12oz', 65)"><strong>Latte 12oz</strong><span>$65</span></div>
          <div class="card-producto" onclick="agregarAlCarrito('Mocha', 75)"><strong>Mocha</strong><span>$75</span></div>
          <div class="card-producto" onclick="agregarAlCarrito('Cold Brew', 55)"><strong>Cold Brew</strong><span>$55</span></div>
          <div class="card-producto" onclick="agregarAlCarrito('Espresso Tonic', 70)"><strong>Espresso Tonic</strong><span>$70</span></div>
        </div>
      </section>

      <section class="panel-orden">
        <h2>Comanda Actual</h2>
        <div id="listaCarrito" class="lista-carrito"></div>

        <div class="footer-orden">
          <div class="monto-total">
            <span>TOTAL:</span>
            <strong id="montoTotal">$0.00</strong>
          </div>

          <button class="btn-guardar-comanda" onclick="guardarComandaPendiente()">☁️ Guardar Comanda Pendiente</button>

          <div class="seccion-cobro">
            <p><strong>Selecciona Método de Pago:</strong></p>
            <div class="metodos-pago">
              <button class="btn-pago efectivo" onclick="finalizarCobro('Efectivo')">💵 Efectivo</button>
              <button class="btn-pago tarjeta" onclick="finalizarCobro('Tarjeta')">💳 Tarjeta</button>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <main id="tab-inventario" class="seccion">
    <h2>Control de Inventario</h2>
    <p style="margin-top:10px; color:#64748b;">Módulo en desarrollo.</p>
  </main>

  <main id="tab-corte" class="seccion"></main>

  <div id="modalComandas" class="modal-overlay">
    <div class="modal-content modal-ancho">
      <h3>☁️ Comandas Pendientes en Espera</h3>
      <div id="listaComandasModal" class="lista-comandas-modal"></div>
      <button class="btn-cancelar" style="margin-top:15px;" onclick="cerrarModalComandas()">Cerrar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
