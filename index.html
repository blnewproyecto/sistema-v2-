    <style>
        @page {
            size: A4;
            margin: 8mm 10mm 8mm 10mm;
            background-color: #0f172a;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #f8fafc;
            background-color: #0f172a;
            font-size: 8pt;
            line-height: 1.2;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #f59e0b;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 18pt;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            margin: 0 0 4px 0;
        }

        .header p {
            font-size: 9pt;
            letter-spacing: 1px;
            color: #f59e0b;
            text-transform: uppercase;
            margin: 0;
            font-weight: 600;
        }

        .actions-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-caja {
            background-color: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            font-size: 9pt;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-caja:hover {
            background-color: #d97706;
        }

        .menu-grid {
            display: flex;
            gap: 20px;
        }

        .column {
            flex: 1;
        }

        .section-title {
            font-size: 9pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #f59e0b;
            border-bottom: 1px solid #334155;
            padding-bottom: 2px;
            margin-top: 10px;
            margin-bottom: 6px;
        }

        .menu-item {
            margin-bottom: 4px;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .item-name {
            font-weight: 500;
            color: #e2e8f0;
        }

        .item-dots {
            flex-grow: 1;
            border-bottom: 1px dotted #475569;
            margin: 0 8px;
        }

        .item-price {
            font-weight: 700;
            color: #f59e0b;
            white-space: nowrap;
        }

        /* Estilos de impresión para el Ticket de Cierre */
        @media print {
            body * {
                visibility: hidden;
            }
            #ticket-cierre, #ticket-cierre * {
                visibility: visible;
            }
            #ticket-cierre {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                color: #000;
                background: #fff;
                padding: 10px;
                font-family: monospace;
            }
            .actions-bar {
                display: none;
            }
        }

        #ticket-cierre {
            display: none;
        }
    </style>

        // Función para renderizar el menú en pantalla
        function renderMenu() {
            const leftCol = document.getElementById('col-left');
            const rightCol = document.getElementById('col-right');

            const categories = [
                { id: "calientes-cafe", title: "Calientes Café" },
                { id: "calientes-sin-cafe", title: "Calientes Sin Café" },
                { id: "especiales-calientes", title: "Calientes Especiales" },
                { id: "infusionables", title: "Infusionables & Tés" },
                { id: "frias-cafe", title: "Bebidas Frías con Café" },
                { id: "frias-sin-cafe", title: "Frías Sin Café & Especiales" },
                { id: "cold-foam-varios", title: "Cold Foam, Malteadas & Varios" },
                { id: "salados", title: "Alimentos Salados" },
                { id: "dulces", title: "Alimentos Dulces & Repostería" }
            ];

            categories.forEach((cat, index) => {
                const items = menuData.filter(i => i.category === cat.id);
                if (items.length === 0) return;

                let html = `<div class="section-title">${cat.title}</div>`;
                items.forEach(item => {
                    html += `
                        <div class="menu-item">
                            <div class="item-header">
                                <span class="item-name">${item.name}</span>
                                <span class="item-dots"></span>
                                <span class="item-price">$${item.price}</span>
                            </div>
                        </div>
                    `;
                });

                if (index < 5) {
                    leftCol.innerHTML += html;
                } else {
                    rightCol.innerHTML += html;
                }
            });
        }

        // Función para ejecutar el cierre de caja e imprimir el ticket
        function cerrarCaja() {
            const fecha = new Date().toLocaleString();
            const ticketContainer = document.getElementById('ticket-cierre');

            // Generar la plantilla del ticket de corte
            ticketContainer.innerHTML = `
                <div style="text-align: center; width: 280px; font-family: monospace;">
                    <h2 style="margin: 0;">BLESS COFFEE</h2>
                    <p style="margin: 2px 0;">Corte de Caja - Cierre Turno</p>
                    <p style="margin: 2px 0;">Fecha: ${fecha}</p>
                    <hr style="border-top: 1px dashed #000;">
                    <p style="text-align: left; margin: 4px 0;">Estado: CAJA CERRADA</p>
                    <p style="text-align: left; margin: 4px 0;">Total Productos Registrados: ${menuData.length}</p>
                    <hr style="border-top: 1px dashed #000;">
                    <p style="margin-top: 15px;">*** CORTE COMPLETO ***</p>
                </div>
            `;

            // Ejecutar la orden de impresión del navegador
            window.print();
        }

        // Inicializar renderizado
        renderMenu();
