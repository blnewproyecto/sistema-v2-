<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bless Coffee - POS Completo</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* BARRA SUPERIOR CON EL BOTÓN DE CORTE */
        .top-bar {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .btn-corte-top {
            background-color: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 10px 25px;
            font-weight: 800;
            font-size: 10pt;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-corte-top:active {
            background-color: #d97706;
            transform: scale(0.98);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #f59e0b;
            padding-bottom: 4px;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 18pt;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .pos-container {
            display: flex;
            gap: 15px;
            flex: 1;
            overflow: hidden;
        }

        /* PANEL IZQUIERDO: SELECCIÓN DE PRODUCTOS */
        .products-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        .categories {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .btn-cat {
            background-color: #1e293b;
            color: #f59e0b;
            border: 1px solid #f59e0b;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 8.5pt;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-cat.active {
            background-color: #f59e0b;
            color: #0f172a;
        }

        .grid-products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .btn-product {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            cursor: pointer;
            min-height: 80px;
        }

        .btn-product:active {
            background-color: #334155;
            transform: scale(0.96);
        }

        .btn-product .name {
            font-size: 8.5pt;
            font-weight: 600;
        }

        .btn-product .price {
            font-size: 10.5pt;
            font-weight: bold;
            color: #f59e0b;
            margin-top: 4px;
        }

        /* PANEL DERECHO: CARRITO Y VENTA */
        .cart-panel {
            flex: 1;
            background-color: #1e293b;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #334155;
        }

        .cart-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #334155;
            font-size: 8.5pt;
        }

        .qty-controls {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .btn-qty {
            background-color: #334155;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-totals {
            border-top: 2px solid #f59e0b;
            padding-top: 8px;
            margin-top: 8px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 13pt;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .btn-cobrar {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 10pt;
            cursor: pointer;
            text-transform: uppercase;
            background-color: #22c55e;
            color: #ffffff;
        }

        /* FORMATO EXCLUSIVO TICKET IMPRESO */
        @media print {
            body * {
                visibility: hidden;
            }
            #ticket-cierre, #ticket-cierre * {
                visibility: visible;
            }
            #ticket-cierre {
                position: absolute;
                left: 0;
                top: 0;
                width: 280px;
                color: #000;
                background: #fff;
                padding: 10px;
                font-family: monospace;
            }
        }

        #ticket-cierre {
            display: none;
        }
    </style>
</head>

        let carrito = [];
        let acumuladoTotalCaja = 0;
        let totalOrdenesCobradas = 0;

        function init() {
            const categoriesBar = document.getElementById('categories-bar');
            const categories = [...new Set(menuData.map(item => item.category))];
            
            categoriesBar.innerHTML = `<button class="btn-cat active" onclick="filtrarCategoria('Todas', this)">Todas</button>`;
            categories.forEach(cat => {
                categoriesBar.innerHTML += `<button class="btn-cat" onclick="filtrarCategoria('${cat}', this)">${cat}</button>`;
            });

            renderProductos(menuData);
        }

        function renderProductos(items) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            items.forEach(item => {
                grid.innerHTML += `
                    <div class="btn-product" onclick="agregarAlCarrito(${item.id})">
                        <span class="name">${item.name}</span>
                        <span class="price">$${item.price}</span>
                    </div>
                `;
            });
        }

        function filtrarCategoria(cat, btn) {
            document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (cat === 'Todas') {
                renderProductos(menuData);
            } else {
                renderProductos(menuData.filter(i => i.category === cat));
            }
        }

        function agregarAlCarrito(id) {
            const prod = menuData.find(p => p.id === id);
            const existe = carrito.find(item => item.id === id);

            if (existe) {
                existe.qty++;
            } else {
                carrito.push({ ...prod, qty: 1 });
            }
            renderCarrito();
        }

        function cambiarCantidad(id, cambio) {
            const item = carrito.find(i => i.id === id);
            if (item) {
                item.qty += cambio;
                if (item.qty <= 0) {
                    carrito = carrito.filter(i => i.id !== id);
                }
            }
            renderCarrito();
        }

        function renderCarrito() {
            const cartList = document.getElementById('cart-items');
            cartList.innerHTML = '';
            let total = 0;

            carrito.forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                cartList.innerHTML += `
                    <li class="cart-item">
                        <div>
                            <div><strong>${item.name}</strong></div>
                            <div>$${item.price} c/u</div>
                        </div>
                        <div class="qty-controls">
                            <button class="btn-qty" onclick="cambiarCantidad(${item.id}, -1)">-</button>
                            <span style="padding:0 4px;">${item.qty}</span>
                            <button class="btn-qty" onclick="cambiarCantidad(${item.id}, 1)">+</button>
                        </div>
                    </li>
                `;
            });

            document.getElementById('total-monto').textContent = total.toFixed(2);
        }

        function cobrarOrden() {
            if (carrito.length === 0) return alert("El carrito está vacío.");

            const totalOrden = carrito.reduce((sum, item) => sum + (item.price * item.qty), 0);
            acumuladoTotalCaja += totalOrden;
            totalOrdenesCobradas++;

            alert(`Venta cobrada con éxito: $${totalOrden.toFixed(2)}`);
            carrito = [];
            renderCarrito();
        }

            const ticketContainer = document.getElementById('ticket-cierre');

                    <p style="margin: 3px 0;">CORTE DE CAJA FINAL</p>

                    <p style="text-align: left; margin: 3px 0;">Fecha: ${fecha}</p>
                    <p style="text-align: left; margin: 3px 0;">Órdenes cobradas: ${totalOrdenesCobradas}</p>
                    <p style="margin: 3px 0;">---------------------------</p>
                    <h3 style="margin: 5px 0; text-align: right; font-size: 15px;">TOTAL CAJA: $${acumuladoTotalCaja.toFixed(2)}</h3>
                    <p style="margin: 3px 0;">---------------------------</p>
                    <p style="margin-top: 10px;">*** CAJA CERRADA EXITOSAMENTE ***</p>
                </div>
            `;

            window.print();
        }

        init();
    </script>
</body>
