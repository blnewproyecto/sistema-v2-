<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Cafetería de Especialidad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navegación Principal -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="btn-tab active" id="tabBtnPos">☕ Punto de Venta</button>
      <button class="btn-tab" id="tabBtnInv">📦 Inventario</button>
      <button class="btn-tab" id="tabBtnCorte">📊 Corte de Caja</button>
    </div>
    <div class="nav-right">
      <button class="btn-comandas-pendientes" id="btnVerComandas">
        ☁️ Comandas Pendientes <span id="badgeComandasCount" class="badge">0</span>
      </button>
    </div>
  </nav>

  <!-- PESTAÑA 1: PUNTO DE VENTA -->
  <main id="tab-pos" class="seccion active">
    <div class="pos-grid">
      
      <!-- Catálogo de Bebidas -->
      <section class="panel-catalogo">
        <h2>Bebidas Reales</h2>
        
        <div class="modificadores">
          <label for="selectLeche"><strong>Tipo de Leche:</strong></label>
          <select id="selectLeche">
            <option value="Entera">Entera ($0)</option>
            <option value="Deslactosada">Deslactosada ($0)</option>
            <option value="Avena">Avena (+$10)</option>
            <option value="Almendra">Almendra (+$10)</option>
          </select>
        </div>

        <div id="gridProductos" class="grid-productos"></div>
      </section>

      <!-- Panel de Orden / Comanda Actual -->
      <section class="panel-orden">
        <h2>Comanda Actual</h2>
        <div id="listaCarrito" class="lista-carrito"></div>

        <div class="footer-orden">
          <div class="monto-total">
            <span>TOTAL:</span>
            <strong id="montoTotal">$0.00</strong>
          </div>

          <button id="btnGuardarComanda" class="btn-guardar-comanda">☁️ Guardar Comanda Pendiente</button>

          <!-- Opciones de cobro directo -->
          <div class="seccion-cobro">
            <p><strong>Selecciona Método de Pago:</strong></p>
            <div class="metodos-pago">
              <button id="btnPagoEfectivo" class="btn-pago efectivo">💵 Efectivo</button>
              <button id="btnPagoTarjeta" class="btn-pago tarjeta">💳 Tarjeta</button>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- PESTAÑA 2: INVENTARIO -->
  <main id="tab-inventario" class="seccion">
    <h2>Control de Inventario</h2>
    <p style="margin-top:10px; color:#64748b;">Módulo en desarrollo.</p>
  </main>

  <!-- PESTAÑA 3: CORTE DE CAJA -->
  <main id="tab-corte" class="seccion">
    <!-- Se genera desde JS -->
  </main>

  <!-- MODAL: Comandas Pendientes -->
  <div id="modalComandas" class="modal-overlay">
    <div class="modal-content modal-ancho">
      <h3>☁️ Comandas Pendientes en Espera</h3>
      <div id="listaComandasModal" class="lista-comandas-modal"></div>
      <button id="btnCerrarModalComandas" class="btn-cancelar" style="margin-top:15px;">Cerrar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
