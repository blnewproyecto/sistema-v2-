<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital</title>
    <style>
        /* Estilos generales */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Navegación por Pestañas */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background-color: #e0e0e0;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background-color: #2e7d32;
            color: white;
        }

        /* Títulos de categoría */
        .categoria-titulo {
            font-size: 1.4rem;
            color: #333;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 8px;
        }

        /* Cuadrícula de productos (Grid) */
        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        /* Estilo de Tarjetas */
        .producto-card {
            background: #ffffff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border: 1px solid #eee;
        }

        .producto-card h4 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            color: #222;
        }

        .producto-card p {
            margin: 0 0 10px 0;
            color: #666;
            font-size: 0.9rem;
        }

        .producto-card .precio {
            font-weight: bold;
            color: #2e7d32;
            font-size: 1rem;
        }

        /* Control de visualización de secciones */
        .seccion {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- PESTAÑA: BEBIDAS FRÍAS -->
        <div id="tab-frias" class="seccion">
            
            <!-- Categoría 1: Café Frío -->
            <h3 class="categoria-titulo">Café Frío</h3>
            <div class="grid-productos" id="grid-frias-cafe">
                <!-- Se renderizan bebidas frías con café -->
            </div>

            <!-- Categoría 2: Bebidas Sin Café -->
            <h3 class="categoria-titulo">Bebidas Sin Café</h3>
            <div class="grid-productos" id="grid-frias-sincafe">
                <!-- Se renderizan bebidas frías sin café -->
            </div>

            <!-- NUEVA CATEGORÍA AGREGADA -->
            <h3 class="categoria-titulo">Agua Mineral / Preparadas</h3>
            <div class="grid-productos" id="grid-frias-minerales">
                <!-- Se renderizan agua mineral y bebidas preparadas -->
            </div>

        </div> <!-- CIERRE DE #tab-frias -->

        <!-- PESTAÑA: BEBIDAS CALIENTES -->
        <div id="tab-calientes" class="seccion" style="display: none;">
            <h3 class="categoria-titulo">Café Caliente</h3>
            <div class="grid-productos" id="grid-calientes-cafe"></div>
        </div>

    </div>

</body>
</html>
